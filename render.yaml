services:
  - type: web
    name: stacey-shop
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Stacey's admin login password (10+ characters, or the server
      # refuses to start). Set it in the Render dashboard, share it only
      # with her, and never commit it: this repo is public.
      - key: ADMIN_PASSWORD
        sync: false
      # Optional but strongly recommended: free Supabase project so product
      # edits survive restarts (Render's free disk is wiped on every deploy).
      # See DEPLOY.md for the 5-minute setup.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Custom domain. With this set, www.taceycollections.co.ke issues a
      # single 301 to the bare domain so Google only ever indexes one host.
      # Safe to set before the domain exists: it only redirects requests
      # that arrive on the www host, so *.onrender.com keeps working.
      - key: CANONICAL_HOST
        value: taceycollections.co.ke
